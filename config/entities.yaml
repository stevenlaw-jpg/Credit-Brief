    name_zh: Blue Owl
    name_short: Blue Owl
    name_short_zh: Blue Owl
    strong_aliases:
      - Blue Owl
      - Blue Owl Capital
      - Blue Owl Credit
      - Blue Owl Capital Corporation
      - GP Strategic Capital
      - Dyal Capital
    weak_aliases: []
    context_terms:
      - credit
      - lending
      - direct lending
      - BDC
      - private credit
      - GP stakes
      - Doug Ostrover
      - Marc Lipschultz
    exclude_terms: []
    vehicles:
      - OBDC
      - OBDE
      - OCIC
      - Blue Owl Capital Corporation
      - Blue Owl Credit Income Corp
      - Blue Owl Technology Income Corp
    sectors: [software, private-credit, gp-stakes, clo, real-estate]
    confidence: high
    credit_scope: >
      IN SCOPE: Blue Owl Credit and its BDCs (OBDC, OBDE, OCIC, OTF, OTIC) —
      direct lending, technology/software lending, NAV and non-accrual disclosures,
      dividends, credit facilities, fund closes; GP Strategic Capital (formerly Dyal),
      because GP stakes is a tracked sub-sector; firm-level events that bear on the
      credit platform (credit leadership, regulation, litigation, fundraising, ratings).
      OUT OF SCOPE: Blue Owl's net-lease real-estate equity business and its
      digital-infrastructure equity business, unless the story is specifically about
      financing, a debt raise or a credit vehicle. A net-lease property acquisition is
      real-estate equity and must be excluded.

