# =============================================================================
# The entity model. See BUILD_SPEC.md §4.
#
# This file is the geology under everything: Agent 1 builds its queries from it,
# the deterministic rule layer matches on it, and Agents 2 and 3 receive the
# `credit_scope` prose verbatim in their system prompts. An error here is
# systematic, not incidental.
#
# Alias semantics (see pipeline/entities.py):
#   strong_aliases  a word-boundary hit is sufficient on its own
#   weak_aliases    needs a co-occurring context_term in the same text
#   context_terms   evidence that this is the right entity
#   exclude_terms   a hit here vetoes the GP entirely, however strong the alias
#   vehicles        funds / BDCs / tickers; treated as strong aliases
#
# Matching is word-boundary based. Aliases that look like acronyms (^[A-Z]{2,6}$)
# are matched case-sensitively; everything else is case-insensitive.
# =============================================================================

gps:

