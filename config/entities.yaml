# =============================================================================
# Sub-sectors. `requires_credit_context: true` means a keyword hit only counts
# when a credit-context term also appears, or a GP has already matched — the
# word "software" on its own is not a credit story.
# =============================================================================

sectors:

  - id: software
    name: Software
    name_zh: 软件
    requires_credit_context: true
    confidence: high
    keywords:
      - software
      - SaaS
      - enterprise software
      - technology lending
      - tech lending
      - software borrower
      - recurring revenue loan
      - ARR loan
      - venture debt
      - technology borrower
    primary_gps: [blue-owl, otf, kkr, apollo, neuberger-berman]
    scope: >
      Lending to software and technology companies: recurring-revenue and ARR-based
      facilities, unitranche loans to sponsor-backed software businesses, technology
      BDC portfolios, venture debt, and the credit quality of software borrowers
      (including the effect of AI on their revenue durability and refinancing ability).

  - id: private-credit
    name: Private credit
    name_zh: 私募信贷
    requires_credit_context: false
    confidence: high
    keywords:
      - private credit
      - private debt
      - direct lending
      - direct lender
      - unitranche
      - BDC
      - business development company
      - middle market lending
      - mid-market lending
      - non-bank lender
      - senior secured loan
      - broadly syndicated loan
      - leveraged loan
      - non-accrual
      - PIK
      - payment-in-kind
    primary_gps: [blue-owl, otf, kkr, apollo, bain-capital, neuberger-berman, hsbc-am, pag]
    scope: >
      The private-credit and direct-lending market: fund raises and closes, BDC
      results and NAV marks, non-accruals and PIK income, deal flow and competition
      with the syndicated market, bank / private-credit partnerships, leverage and
      liquidity at credit vehicles, regulation of private credit and BDCs, and
      evidence of stress or opportunity in the asset class.

  - id: gp-stakes
    name: GP stakes
    name_zh: GP 股权投资
    requires_credit_context: false
    confidence: medium
    keywords:
      - GP stakes
      - GP stake
      - GP staking
      - strategic capital
      - minority stake in a manager
      - stake in the manager
      - Dyal
      - Bonaccord
      - Blue Owl GP Strategic Capital
      - manager stake sale
    primary_gps: [blue-owl, neuberger-berman]
    scope: >
      Minority stakes in alternative-asset managers themselves: GP-stake fund raises,
      stake sales by managers, continuation vehicles for GP-stake portfolios, and the
      valuation and financing of those stakes. Blue Owl's GP Strategic Capital
      (formerly Dyal) is the anchor holding here.

  - id: aircraft-leasing
    name: Aircraft leasing
    name_zh: 飞机租赁
    requires_credit_context: false
    confidence: medium
    keywords:
      - aircraft leasing
      - aircraft lessor
      - aircraft finance
      - aircraft lending
      - aviation finance
      - aviation lending
      - aviation ABS
      - aircraft ABS
      - EETC
      - aircraft portfolio financing
      - engine leasing
      - private jet finance
      - sale-leaseback aircraft
    primary_gps: [guggenheim, bain-capital, kkr, apollo]
    scope: >
      Financing secured on aircraft: operating-lease portfolios, aviation ABS and
      EETC issuance, aircraft sale-leasebacks, engine and private-jet lending, and
      the credit performance of lessors and their airline counterparties.
      NOT IN SCOPE: aviation infrastructure equity — airports, FBO networks, ground
      handling, MRO businesses — which is infrastructure investing, not aircraft
      credit, even when a tracked manager is the buyer.

  - id: abl
