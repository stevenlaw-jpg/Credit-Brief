<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit Brief</title>
<meta name="description" content="A daily credit-markets brief for a family office invested in the credit strategies of 13 managers across 8 sub-sectors.">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23222'/><path d='M9 21V11h4.6c2.2 0 3.6 1 3.6 2.7 0 1.2-.7 2-1.7 2.3 1.3.3 2.2 1.2 2.2 2.6 0 1.9-1.5 3-3.9 3H9z' fill='%23fff'/><circle cx='23' cy='19' r='2.6' fill='%23c2703a'/></svg>">
</head>
<body>

<a class="skip-link" href="#items">Skip to today's items</a>

<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-text">
      <h1 id="site-title">Credit Brief</h1>
      <p class="standfirst" id="site-standfirst"></p>
    </div>
    <!-- R6: the language toggle sits in the top-right corner. -->
    <div class="lang-toggle" role="group" aria-labelledby="lang-toggle-label">
      <span class="visually-hidden" id="lang-toggle-label">Language</span>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" id="lang-zh" data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </div>
  <p class="meta-line" id="meta-line"></p>
</header>

<nav class="dates" id="dates" aria-label="Archive by date">
  <button type="button" class="date-step" id="date-newer" aria-label="Newer day">&#8249;</button>
  <div class="date-track" id="date-track" role="list"></div>
  <button type="button" class="date-step" id="date-older" aria-label="Older day">&#8250;</button>
</nav>

<main>
  <h2 class="day-heading" id="day-heading"></h2>
  <div id="status" class="status" hidden></div>
  <ol class="items" id="items"></ol>
</main>

<footer>
  <p id="footer-note"></p>
</footer>

<template id="item-template">
  <li class="item">
    <h3 class="item-title"></h3>
    <p class="item-summary"></p>
    <p class="item-source">
      <a class="item-link" target="_blank" rel="noopener noreferrer"></a>
      <span class="sep" aria-hidden="true">·</span>
      <time class="item-time"></time>
      <span class="item-also"></span>
    </p>
    <p class="tags"></p>
  </li>
</template>

<script src="assets/app.js"></script>
</body>
</html>
